spring:
  application:
    name: autedi
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 25MB
  jpa:
    open-in-view: false
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

app:
  mail:
    from-address: ${MAIL_FROM_ADDRESS:${MAIL_USERNAME:}}
    from-name: ${MAIL_FROM_NAME:AUTEDI}
  frontend-url: ${FRONTEND_URL:http://localhost:3000}

springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: ${SWAGGER_ENABLED:false}
  swagger-ui:
    path: /autedi-docs
    enabled: ${SWAGGER_ENABLED:false}
    operations-sorter: method
    tags-sorter: alpha

swagger:
  user: ${SWAGGER_USER:autedi}
  password: ${SWAGGER_PASSWORD:autedi2026!}

jwt:
  secret: ${JWT_SECRET:autedi-local-dev-secret-key-must-be-at-least-32-bytes-long-2026}
  access-token-expiration-ms: ${JWT_ACCESS_EXPIRATION_MS:3600000}
  refresh-token-expiration-days: ${JWT_REFRESH_EXPIRATION_DAYS:14}
