spring:
  application:
    name: autedi
  datasource:
    url: jdbc:mysql://${MYSQLHOST}:${MYSQLPORT}/${MYSQLDATABASE}?allowPublicKeyRetrieval=true&useSSL=false&characterEncoding=UTF-8&serverTimezone=Asia/Seoul
    username: ${MYSQLUSER}
    password: ${MYSQLPASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
    show-sql: true

# AWS S3 개발 배포 설정 (Railway 환경변수 주입)
cloud:
  aws:
    region:
      static: ${AWS_REGION:${AWS_DEFAULT_REGION:ap-northeast-2}}
    s3:
      bucket: ${AWS_S3_BUCKET:${S3_BUCKET:autedi-mvp-develop-bucket}}
    credentials:
      access-key: ${AWS_ACCESS_KEY_ID:${AWS_ACCESS_KEY:}}
      secret-key: ${AWS_SECRET_ACCESS_KEY:${AWS_SECRET_KEY:}}

aws:
  region: ${AWS_REGION:${AWS_DEFAULT_REGION:ap-northeast-2}}
  s3:
    bucket: ${AWS_S3_BUCKET:${S3_BUCKET:autedi-mvp-develop-bucket}}
  credentials:
    access-key: ${AWS_ACCESS_KEY_ID:${AWS_ACCESS_KEY:}}
    secret-key: ${AWS_SECRET_ACCESS_KEY:${AWS_SECRET_KEY:}}

springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:true}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:true}

server:
  port: ${PORT:8080}

app:
  storage:
    type: ${STORAGE_TYPE:s3}
  mail:
    type: ${MAIL_TYPE:http}
    http:
      api-key: ${RESEND_API_KEY:}
      endpoint: ${MAIL_HTTP_ENDPOINT:https://api.resend.com/emails}
      from: ${MAIL_HTTP_FROM:onboarding@resend.dev}
