spring:
  application:
    name: autedi
  datasource:
    url: ${DEV_DB_URL:${DB_URL:jdbc:mysql://${DB_HOST:${MYSQLHOST:mysql}}:${DB_PORT:${MYSQLPORT:3306}}/${DB_NAME:${MYSQLDATABASE:autedi_dev}}?allowPublicKeyRetrieval=true&useSSL=false&characterEncoding=UTF-8&serverTimezone=Asia/Seoul}}
    username: ${DEV_DB_USERNAME:${DB_USERNAME:${DB_USER:${MYSQLUSER:autedi}}}}
    password: ${DEV_DB_PASSWORD:${DB_PASSWORD:${MYSQLPASSWORD:autedi2026!}}}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.MySQLDialect
    show-sql: ${SHOW_SQL:false}

# AWS S3 개발 배포 설정 (EC2 / Railway 공용 환경변수 주입)
cloud:
  aws:
    region:
      static: ${AWS_REGION:${AWS_DEFAULT_REGION:ap-northeast-2}}
    s3:
      bucket: ${AWS_S3_BUCKET:${S3_BUCKET:autedi-mvp-develop-bucket}}
    credentials:
      access-key: ${AWS_ACCESS_KEY_ID:${AWS_ACCESS_KEY:}}
      secret-key: ${AWS_SECRET_ACCESS_KEY:${AWS_SECRET_KEY:}}

aws:
  region: ${AWS_REGION:${AWS_DEFAULT_REGION:ap-northeast-2}}
  s3:
    bucket: ${AWS_S3_BUCKET:${S3_BUCKET:autedi-mvp-develop-bucket}}
  credentials:
    access-key: ${AWS_ACCESS_KEY_ID:${AWS_ACCESS_KEY:}}
    secret-key: ${AWS_SECRET_ACCESS_KEY:${AWS_SECRET_KEY:}}

springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:true}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:true}

server:
  port: ${PORT:8080}

app:
  storage:
    type: ${STORAGE_TYPE:s3}
  mail:
    type: ${MAIL_TYPE:smtp}
    http:
      api-key: ${RESEND_API_KEY:}
      endpoint: ${MAIL_HTTP_ENDPOINT:https://api.resend.com/emails}
      from: ${MAIL_HTTP_FROM:onboarding@resend.dev}
  generation:
    dispatch-interval-ms: ${GENERATION_DISPATCH_INTERVAL_MS:30000}
