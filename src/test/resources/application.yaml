spring:
  application:
    name: autedi
  datasource:
    url: jdbc:h2:mem:auteditest;DB_CLOSE_DELAY=-1;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 25MB

# AWS S3 테스트 설정 (외부 종속성 격리)
cloud:
  aws:
    region:
      static: ap-northeast-2
    s3:
      bucket: test-bucket
    credentials:
      access-key: test-key
      secret-key: test-secret

aws:
  region: ap-northeast-2
  s3:
    bucket: test-bucket
  credentials:
    access-key: test-key
    secret-key: test-secret

springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: ${SWAGGER_ENABLED:true}
  swagger-ui:
    path: /autedi-docs
    enabled: ${SWAGGER_ENABLED:true}
    operations-sorter: method
    tags-sorter: alpha

swagger:
  user: ${SWAGGER_USER:autedi}
  password: ${SWAGGER_PASSWORD:autedi2026!}

jwt:
  secret: ${JWT_SECRET:autedi-local-dev-secret-key-must-be-at-least-32-bytes-long-2026}
  access-token-expiration-ms: ${JWT_ACCESS_EXPIRATION_MS:3600000}
  refresh-token-expiration-days: ${JWT_REFRESH_EXPIRATION_DAYS:14}
