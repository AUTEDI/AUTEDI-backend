# ========================================================
# Nginx Configuration for Production Backend
#   - api.autedi.co.kr            (신규 운영 도메인)
#   - autedi-mvp.duckdns.org      (기존 도메인: 새 도메인 검증이 끝날 때까지 공존, 이후 제거)
# 서버 경로: /srv/mvp-data/nginx/conf.d/default.conf
# ========================================================

# --------------------------------------------------------
# [신규] api.autedi.co.kr
# --------------------------------------------------------
server {
    listen 80;
    server_name api.autedi.co.kr;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name api.autedi.co.kr;

    ssl_certificate /etc/letsencrypt/live/api.autedi.co.kr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.autedi.co.kr/privkey.pem;

    # 스마트폰 영어 사진 업로드를 위해 최대 25MB 허용 (기본값 1MB)
    client_max_body_size 25M;

    # Docker 내부 DNS 리졸버: 운영 컨테이너가 재생성되는 중에도 Nginx 구동/reload 실패 방지
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $prod_backend spring-app:8080;

    location / {
        proxy_pass http://$prod_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # OCR + 외부 AI 응답 대기를 위해 타임아웃 여유 확보
        proxy_read_timeout 120s;
        proxy_connect_timeout 60s;
    }
}

# --------------------------------------------------------
# [기존] autedi-mvp.duckdns.org (서버 설정 그대로, 변경 없음)
# --------------------------------------------------------
server {
    listen 80;
    server_name autedi-mvp.duckdns.org;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name autedi-mvp.duckdns.org;

    ssl_certificate /etc/letsencrypt/live/autedi-mvp.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/autedi-mvp.duckdns.org/privkey.pem;

    # 스마트폰 영어 사진 업로드를 위해 최대 25MB 허용 (기본값 1MB)
    client_max_body_size 25M;

    location / {
        proxy_pass http://spring-app:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # OCR + 외부 AI 응답 대기를 위해 타임아웃 여유 확보
        proxy_read_timeout 120s;
        proxy_connect_timeout 60s;
    }
}
