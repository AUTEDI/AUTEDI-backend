# ========================================================
# Nginx Configuration for Dev / QA Backend (dev-api.autedi.com or DuckDNS)
# ========================================================

server {
    listen 80;
    server_name autedi-mvp-dev.duckdns.org auteddi-mvp-dev.duckdns.org;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name autedi-mvp-dev.duckdns.org auteddi-mvp-dev.duckdns.org;

    # SSL certificates managed by Let's Encrypt / Certbot
    ssl_certificate /etc/letsencrypt/live/autedi-mvp-dev.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/autedi-mvp-dev.duckdns.org/privkey.pem;

    # Smart-phone high-resolution photo upload size (Spring Boot multipart support)
    client_max_body_size 25M;

    # Dynamic DNS resolution for container resilience
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $dev_backend spring-app-dev:8080;

    # Dev / QA Spring Boot Container Proxy
    location / {
        proxy_pass http://$dev_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # AI & OCR response timeout buffer
        proxy_read_timeout 120s;
        proxy_connect_timeout 60s;
    }
}
